<!doctype html><meta charset=utf-8><title>editable</title>
<h2>Editable and interactive</h2>
<p id="prose">Ordinary prose here that should be treated exactly as normal text is.</p>
<div id="ce" contenteditable="true">Editable text that must never be highlighted at all</div>
<div id="tb" role="textbox">Textbox role content that must never be highlighted either</div>
<textarea id="ta" rows=2>Textarea content that must never be highlighted at all here</textarea>
<button id="btn">A button label with several words in it here</button>
<select id="sel"><option>An option label with several words in it</option></select>
