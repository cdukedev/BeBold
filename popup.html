<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BeBold</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 268px; margin: 0; padding: 14px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 14px; margin: 0 0 10px; font-weight: 600; letter-spacing: .01em; }
  h1 b { font-weight: 800; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 7px 0;
  }
  .row + .row { border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
  label { cursor: pointer; }
  .origin {
    font: 11px/1.3 ui-monospace, Menlo, monospace;
    opacity: .65; word-break: break-all; margin: 0 0 2px;
  }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; cursor: pointer; }
  #stats {
    margin: 10px 0 0; padding: 8px 9px; border-radius: 6px;
    background: color-mix(in srgb, CanvasText 7%, transparent);
    font-size: 12px;
  }
  #stats b { font-variant-numeric: tabular-nums; }
  #reasons { margin: 5px 0 0; padding: 0; list-style: none; font-size: 11px; opacity: .75; }
  #reasons li { display: flex; justify-content: space-between; gap: 8px; }
  footer { margin: 11px 0 0; display: flex; justify-content: space-between; align-items: center; }
  a, button.link {
    color: LinkText; background: none; border: 0; padding: 0;
    font: inherit; cursor: pointer; text-decoration: underline;
  }
  .muted { opacity: .6; font-size: 11px; }
  :focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
</style>
</head>
<body>
  <h1><b>Be</b>Bold</h1>

  <div class="row">
    <label for="enabled">Enabled everywhere</label>
    <input type="checkbox" id="enabled">
  </div>

  <div class="row">
    <label for="site">
      On this site
      <span class="origin" id="origin"></span>
    </label>
    <input type="checkbox" id="site">
  </div>

  <div id="stats" role="status" aria-live="polite">
    <span id="summary">Checking this page…</span>
    <ul id="reasons"></ul>
  </div>

  <footer>
    <a href="#" id="options">Settings</a>
    <span class="muted" id="perf"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
